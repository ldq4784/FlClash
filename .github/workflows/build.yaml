name: build

on:
  push:
    branches:
      - '**'
    tags:
      - 'v*'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: '3.47.6'
  GO_VERSION: '1.27.1'
  NDK_VERSION: r28c

permissions:
  contents: write

jobs:
  build-android-arm64:
    name: Build Android arm64 APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Rust Android Target
        run: |
          rustup target add aarch64-linux-android
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH

      - name: Add pub-cache to PATH
        run: echo "$HOME/.pub-cache/bin" >> $GITHUB_PATH

      - name: Setup Android Signing
        if: ${{ secrets.KEYSTORE != '' }}
        run: |
          echo "${{ secrets.KEYSTORE }}" | base64 --decode > android/app/keystore.jks
          {
            echo "keyAlias=${{ secrets.KEY_ALIAS }}"
            echo "storePassword=${{ secrets.STORE_PASSWORD }}"
            echo "keyPassword=${{ secrets.KEY_PASSWORD }}"
          } >> android/local.properties

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: core/go.sum

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Setup NDK
        uses: nttld/setup-ndk@v1
        id: build-ndk
        with:
          ndk-version: ${{ env.NDK_VERSION }}
          add-to-path: true
          link-to-sdk: true

      - name: Ensure libclang in NDK
        run: |
          ndk="${{ steps.build-ndk.outputs.ndk-path }}"
          llvm="$ndk/toolchains/llvm/prebuilt/linux-x86_64"
          if [ -d "$llvm/musl/lib" ]; then
            mkdir -p "$llvm/lib"
            ln -sf "$llvm/musl/lib/libclang.so" "$llvm/lib/libclang.so"
            ln -sf "$llvm/musl/lib/libc_musl.so" "$llvm/lib/libc_musl.so" || true
          fi

      - name: Get Flutter Dependency
        run: |
          flutter --version
          flutter pub get

      - name: Fetch CA certificates
        shell: bash
        env:
          CA_BUNDLE: cacert-2026-09-25.pem
          CA_BUNDLE_SHA256: a41b5d356aea97a529fe27e0f7316d2f9d946d75927476cf9cf1b90637d00505
        run: |
          bundle=core/Clash.Meta/component/ca/ca-certificates.crt
          curl -fsSL --retry 3 -o "$bundle" "https://curl.se/ca/$CA_BUNDLE"
          echo "$CA_BUNDLE_SHA256  $bundle" | sha256sum -c -

      - name: Build Android arm64 APK
        env:
          ANDROID_NDK_HOME: ${{ steps.build-ndk.outputs.ndk-path }}
        run: dart setup.dart android --arch arm64 --env stable -v

      - name: Generate sha256
        run: |
          cd ./dist
          sha256sum ./* > SHA256SUMS

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: FlClash-android-arm64
          path: ./dist/*

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: ./dist/*
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('v0.9.2-arm64-build{0}', github.run_number) }}
          name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('Release v0.9.2-arm64-build{0}', github.run_number) }}
          draft: false
          prerelease: false
          generate_release_notes: true
